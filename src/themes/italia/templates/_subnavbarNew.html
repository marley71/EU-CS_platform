{% load i18n %}
{% load active_link_tags %}
{% load static %}

<div class="row px-3">
    <div class="col-12">
        <!-- {{ homeSearchCategories }} -->
        <form id="searchTop"
            {% if 'organisations' == homeSearchCategories %}
              action="/organisations"
            {% elif 'users' == homeSearchCategories %}
              action="/users"
            {% else %}
{#                {% if isProject %}#}
                    action="/projects"
{#                {% else %}#}
{#                    action="/attivita"#}
{#                {% endif %}#}
            {% endif %}

        >
            <input type="hidden" name="homeSearchCategories" value="{{ homeSearchCategories }}" />
            <div class="d-flex align-items-center mt-3 gap-2 mb-4">

                <div class="input-group">
                    <input type="text"
                           id="keywords"
                           name="keywords"
                           autocomplete="off"
                           value="{{ filters.keywords }}"
                           class="basicAutoComplete form-control form-control-lg rounded-3"
                           placeholder="Cerca Progetti, Attività, Organizzazioni, Utenti"
                           data-url="/home_autocomplete/?category={{ homeSearchCategories }}"
                    >
                </div>
                <div>
                    <button type="submit" class="btn btn-lg btn-primary d-flex align-items-center gap-2 rounded-3">
                        <svg class="bi" width="14" height="14" fill="currentColor">
                            <use xlink:href="{% static 'img/svg/bootstrap-icons.svg' %}#search"/>
                        </svg>
                        Cerca
                    </button>
                </div>
            </div>
        </form>
    </div>


</div>
<script>
    function changeCategory() {
        let cat = $('input[type="radio"][name="homeSearchCategories"]:checked').val();
        let formAction = '/projects';
        if (cat == 'organizzazioni') {
            formAction = '/organisations'
        } else if (cat == 'utenti') {
            formAction = '/users'
        }
        console.debug('ok', cat, formAction);
        $('#searchTop').attr('action', formAction);
        $('#keywords').data('url', '/home_autocomplete/?category=' + cat)

    }
</script>
