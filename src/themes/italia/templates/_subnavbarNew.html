{% load i18n %}
{% load active_link_tags %}
{% load static %}

<div class="row">
    <div class="col-12">
        <form id="searchTop"
                {#                    {% if 'all' in request.get_full_path %}#}
                {#                        action="/all"#}
                {#                    {% elif 'training_resources' in request.get_full_path %}#}
                {#                        action="/training_resources"#}
                {#                    {% elif 'resources' in request.get_full_path %}#}
                {#                        action="/resources"#}
                {% if 'organisations' in request.get_full_path %}
              action="/organisations"
                    {#                    {% elif 'platforms' in request.get_full_path %}#}
                    {#                        action= "/platforms"#}
                {% elif 'users' in request.get_full_path %}
              action="/users"
                {% else %}
              action="/projects"
                {% endif %}>
            <div class="d-flex align-items-center mt-3 gap-2">

                <div class="input-group">
                    <input type="text"
                           id="keywords"
                           name="keywords"
                           autocomplete="off"
                           value="{{ filters.keywords }}"
                           class="basicAutoComplete form-control rounded-3"
                           placeholder="Inserisci una parola chiave"
                           data-url="/home_autocomplete/"
                    >
                </div>
                <div>
                    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2 rounded-3">
                        <svg class="bi" width="14" height="14" fill="currentColor">
                            <use xlink:href="{% static 'img/svg/bootstrap-icons.svg' %}#search"/>
                        </svg> Cerca
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-center align-items-center mt-3">

                <div class="me-3">
                    Cerca in:
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="homeSearchCategories" id="searchProgettiId"
                           value="progetti">
                    <label class="form-check-label" for="searchProgettiId">Progetti</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="homeSearchCategories" id="searchOrganizzazioniId"
                           value="organizzazioni">
                    <label class="form-check-label" for="searchOrganizzazioniId">Organizzazioni</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="homeSearchCategories" id="searchUtentiId"
                           value="utenti">
                    <label class="form-check-label" for="searchUtentiId">Utenti</label>
                </div>
            </div>
        </form>
    </div>

</div>
