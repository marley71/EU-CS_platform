<script>
    function changeCategory() {
        let cat = $('input[type="radio"][name="homeSearchCategories"]:checked').val();
        let formAction = '/projects';
        if (cat == 'organizzazioni') {
            formAction = '/organisations'
        } else if (cat == 'utenti') {
            formAction = '/users'
        }
        console.debug('ok', cat, formAction);
        $('#searchTop').attr('action', formAction);
        $('#keywords').data('url', '/home_autocomplete/?category=' + cat)

    }
</script>
